<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">Trayectoria</title>
  <desc id="d">Big Odoo, Process Control, Indasoge SpA, Transgenia y hoy OpenVoo, VGER SOFT y PGM. 9 años en Odoo, de la versión 10 a la 19.</desc>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141d2b" stroke-width="1"/>
    </pattern>
    <clipPath id="c"><rect width="1200" height="280" rx="18"/></clipPath>
    <linearGradient id="ln" x1="0" x2="1">
      <stop offset="0" stop-color="#2c3d57"/>
      <stop offset="1" stop-color="#7ee0b8"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .run{animation:rn 8s linear infinite}
    .ring{transform-box:fill-box;transform-origin:center;animation:rg 3s ease-out infinite}
    @keyframes rn{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(930px);opacity:0}}
    @keyframes rg{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.4);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#c)">
    <rect width="1200" height="280" fill="#0b1018"/>
    <rect width="1200" height="280" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="279" rx="18" fill="none" stroke="#223047"/>

  <text x="56" y="64" class="mono" font-size="22" letter-spacing="1" fill="#e6edf3">GQ / TRAYECTORIA</text>
  <text x="56" y="96" class="mono" font-size="15" fill="#8b9bb0">9 años en Odoo, de la versión 10 a la 19.</text>

  <rect x="110" y="169" width="930" height="2" fill="url(#ln)"/>
  <circle class="run" cx="110" cy="170" r="4" fill="#e6edf3" opacity="0"/>

  <g class="mono" font-size="14" text-anchor="middle" fill="#7ee0b8">
    <text x="110" y="144">v10</text>
    <text x="1040" y="144">v19</text>
  </g>

  <g fill="#0b1018" stroke="#4a6080" stroke-width="2">
    <circle cx="110" cy="170" r="7"/>
    <circle cx="342" cy="170" r="7"/>
    <circle cx="575" cy="170" r="7"/>
    <circle cx="808" cy="170" r="7"/>
  </g>
  <circle class="ring" cx="1040" cy="170" r="9" fill="none" stroke="#7ee0b8" stroke-width="1.5"/>
  <circle cx="1040" cy="170" r="9" fill="#7ee0b8"/>

  <g class="mono" font-size="16" text-anchor="middle" fill="#e6edf3">
    <text x="110" y="212">Big Odoo</text>
    <text x="342" y="212">Process Control</text>
    <text x="575" y="212">Indasoge SpA</text>
    <text x="808" y="212">Transgenia</text>
    <text x="1040" y="212" fill="#7ee0b8" font-weight="700">Hoy</text>
  </g>
  <g class="mono" font-size="14" text-anchor="middle" fill="#8b9bb0">
    <text x="110" y="236">Full Stack Odoo</text>
    <text x="342" y="236">Odoo Developer</text>
    <text x="575" y="236">Senior Python</text>
    <text x="808" y="236">Desarrollador Odoo</text>
    <text x="1040" y="236">OpenVoo · VGER SOFT · PGM</text>
  </g>
</svg>
