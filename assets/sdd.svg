<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="1200" height="392" role="img" aria-labelledby="t d">
  <title id="t">Spec-Driven Development</title>
  <desc id="d">Cuatro etapas: especificar, planificar, implementar y verificar. La especificación es la fuente de verdad y se actualiza con cada cambio.</desc>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141d2b" stroke-width="1"/>
    </pattern>
    <clipPath id="c"><rect width="1200" height="392" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .f{stroke-dasharray:4 8;animation:fl 1.4s linear infinite}
    .b{stroke-dasharray:3 9;animation:fl 2.4s linear infinite}
    @keyframes fl{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#c)">
    <rect width="1200" height="392" fill="#0b1018"/>
    <rect width="1200" height="392" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="391" rx="18" fill="none" stroke="#223047"/>

  <text x="56" y="64" class="mono" font-size="22" letter-spacing="1" fill="#e6edf3">GQ / SPEC-DRIVEN DEVELOPMENT</text>
  <text x="56" y="96" class="mono" font-size="15" fill="#8b9bb0">La especificación precede y guía al código: es la fuente de verdad del proyecto.</text>

  <!-- retorno -->
  <path class="b" d="M1029 250V288H171V250" fill="none" stroke="#3a4c66" stroke-width="1.5"/>
  <rect x="446" y="276" width="308" height="24" fill="#0b1018"/>
  <text x="600" y="293" class="mono" font-size="13" text-anchor="middle" fill="#8b9bb0">la spec se actualiza con cada cambio</text>

  <!-- conectores -->
  <g fill="none" stroke="#7ee0b8" stroke-width="2">
    <path class="f" d="M286 185H334"/>
    <path class="f" d="M572 185H620"/>
    <path class="f" d="M858 185H906"/>
  </g>
  <g fill="#7ee0b8">
    <path d="M342 185l-10-6v12z"/>
    <path d="M628 185l-10-6v12z"/>
    <path d="M914 185l-10-6v12z"/>
  </g>

  <g fill="#101826">
    <rect x="56" y="120" width="230" height="130" rx="14" stroke="#7ee0b8" stroke-width="2"/>
    <rect x="342" y="120" width="230" height="130" rx="14" stroke="#223047"/>
    <rect x="628" y="120" width="230" height="130" rx="14" stroke="#223047"/>
    <rect x="914" y="120" width="230" height="130" rx="14" stroke="#223047"/>
  </g>

  <g class="mono" font-size="16" letter-spacing=".5">
    <text x="78" y="160" fill="#7ee0b8">01 / ESPECIFICAR</text>
    <text x="364" y="160" fill="#7cc4ff">02 / PLANIFICAR</text>
    <text x="650" y="160" fill="#7cc4ff">03 / IMPLEMENTAR</text>
    <text x="936" y="160" fill="#7cc4ff">04 / VERIFICAR</text>
  </g>
  <g class="mono" font-size="14" fill="#aab6c6">
    <text x="78" y="196">Requisitos formales</text>
    <text x="78" y="218">del ERP</text>
    <text x="364" y="196">Diseño y tareas</text>
    <text x="364" y="218">trazables</text>
    <text x="650" y="196">Código guiado:</text>
    <text x="650" y="218">humano + IA</text>
    <text x="936" y="196">Pruebas contra</text>
    <text x="936" y="218">la especificación</text>
  </g>

  <!-- evita -->
  <text x="56" y="351" class="mono" font-size="15" letter-spacing="1" fill="#f2a66e">EVITA /</text>
  <g fill="#101826" stroke="#f2a66e" stroke-opacity=".5">
    <rect x="150" y="326" width="181" height="38" rx="8"/>
    <rect x="343" y="326" width="280" height="38" rx="8"/>
    <rect x="635" y="326" width="145" height="38" rx="8"/>
  </g>
  <g class="mono" font-size="15" text-anchor="middle" fill="#f2c9a6">
    <text x="240.5" y="351">deriva contextual</text>
    <text x="483" y="351">lógica de negocio fragmentada</text>
    <text x="707.5" y="351">deuda técnica</text>
  </g>
</svg>
