<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Stack técnico</title>
  <desc id="d">Cuatro capas: ERP con Odoo, backend con Python y PostgreSQL, automatización con n8n y GitHub Actions, y entrega con Docker, Git y metodologías.</desc>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141d2b" stroke-width="1"/>
    </pattern>
    <clipPath id="c"><rect width="1200" height="400" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .run{animation:rn 6s ease-in-out infinite}
    @keyframes rn{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(192px);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#c)">
    <rect width="1200" height="400" fill="#0b1018"/>
    <rect width="1200" height="400" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="18" fill="none" stroke="#223047"/>

  <text x="56" y="64" class="mono" font-size="22" letter-spacing="1" fill="#e6edf3">GQ / STACK</text>
  <text x="56" y="96" class="mono" font-size="15" fill="#8b9bb0">Cuatro capas, del ERP a la entrega continua.</text>

  <!-- riel -->
  <path d="M64 152V344" stroke="#223047" stroke-width="2"/>
  <circle cx="64" cy="152" r="5" fill="#7ee0b8"/>
  <circle cx="64" cy="216" r="5" fill="#7cc4ff"/>
  <circle cx="64" cy="280" r="5" fill="#f2a66e"/>
  <circle cx="64" cy="344" r="5" fill="#b8c4d4"/>
  <circle class="run" cx="64" cy="152" r="9" fill="none" stroke="#e6edf3" stroke-width="1.5" opacity="0"/>

  <g class="mono" font-size="15" letter-spacing="1">
    <text x="92" y="157" fill="#7ee0b8">ERP</text>
    <text x="92" y="221" fill="#7cc4ff">BACKEND</text>
    <text x="92" y="285" fill="#f2a66e">AUTOMATIZACIÓN</text>
    <text x="92" y="349" fill="#b8c4d4">ENTREGA</text>
  </g>

  <g fill="#101826" stroke="#223047">
    <rect x="300" y="132" width="154" height="40" rx="8"/>
    <rect x="466" y="132" width="172" height="40" rx="8"/>
    <rect x="650" y="132" width="127" height="40" rx="8"/>
    <rect x="789" y="132" width="235" height="40" rx="8"/>

    <rect x="300" y="196" width="82" height="40" rx="8"/>
    <rect x="394" y="196" width="118" height="40" rx="8"/>
    <rect x="524" y="196" width="100" height="40" rx="8"/>
    <rect x="636" y="196" width="91" height="40" rx="8"/>

    <rect x="300" y="260" width="55" height="40" rx="8"/>
    <rect x="367" y="260" width="136" height="40" rx="8"/>
    <rect x="515" y="260" width="154" height="40" rx="8"/>
    <rect x="681" y="260" width="73" height="40" rx="8"/>

    <rect x="300" y="324" width="154" height="40" rx="8"/>
    <rect x="466" y="324" width="55" height="40" rx="8"/>
    <rect x="533" y="324" width="73" height="40" rx="8"/>
    <rect x="618" y="324" width="82" height="40" rx="8"/>
    <rect x="712" y="324" width="235" height="40" rx="8"/>
  </g>

  <g class="mono" font-size="15" text-anchor="middle" fill="#dbe4ee">
    <text x="377" y="157">Odoo v10 → v19</text>
    <text x="552" y="157">Módulos a medida</text>
    <text x="713.5" y="157">Migraciones</text>
    <text x="906.5" y="157">Facturación electrónica</text>

    <text x="341" y="221">Python</text>
    <text x="453" y="221">PostgreSQL</text>
    <text x="574" y="221">API REST</text>
    <text x="681.5" y="221">Postman</text>

    <text x="327.5" y="285">n8n</text>
    <text x="435" y="285">WhatsApp API</text>
    <text x="592" y="285">GitHub Actions</text>
    <text x="717.5" y="285">CI/CD</text>

    <text x="377" y="349">Docker Compose</text>
    <text x="493.5" y="349">Git</text>
    <text x="569.5" y="349">Scrum</text>
    <text x="659" y="349">Kanban</text>
    <text x="829.5" y="349">Spec-Driven Development</text>
  </g>
</svg>
