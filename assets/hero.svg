<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Gerardo Andrés Quispe Herrera</title>
  <desc id="d">CEO de OpenVoo, fundador de VGER SOFT y Supervisor de Transformación Digital en PGM. 9 años en Odoo.</desc>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141d2b" stroke-width="1"/>
    </pattern>
    <clipPath id="c"><rect width="1200" height="340" rx="18"/></clipPath>
    <radialGradient id="glow" cx="86%" cy="44%" r="42%">
      <stop offset="0" stop-color="#7ee0b8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7ee0b8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .f{stroke-dasharray:3 9;animation:fl 1.6s linear infinite}
    .ring{transform-box:fill-box;transform-origin:center;animation:rg 3s ease-out infinite}
    @keyframes fl{to{stroke-dashoffset:-24}}
    @keyframes rg{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.1);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#c)">
    <rect width="1200" height="340" fill="#0b1018"/>
    <rect width="1200" height="340" fill="url(#g)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#223047"/>

  <text x="64" y="84" class="mono" font-size="16" letter-spacing="1" fill="#7ee0b8">GQUISPEH / ODOO · ERP · TRANSFORMACIÓN DIGITAL</text>
  <text x="62" y="150" class="sans" font-size="48" font-weight="700" fill="#e6edf3">Gerardo Andrés Quispe Herrera</text>
  <text x="64" y="194" class="mono" font-size="17" fill="#8b9bb0">9 años en Odoo · ERP a medida · integraciones · automatización</text>

  <g class="mono" font-size="15" text-anchor="middle">
    <rect x="64" y="236" width="145" height="38" rx="8" fill="#101826" stroke="#7ee0b8" stroke-opacity=".55"/>
    <text x="136.5" y="261" fill="#7ee0b8">CEO · OPENVOO</text>
    <rect x="221" y="236" width="208" height="38" rx="8" fill="#101826" stroke="#7cc4ff" stroke-opacity=".55"/>
    <text x="325" y="261" fill="#7cc4ff">FUNDADOR · VGER SOFT</text>
    <rect x="441" y="236" width="406" height="38" rx="8" fill="#101826" stroke="#f2a66e" stroke-opacity=".55"/>
    <text x="644" y="261" fill="#f2a66e">SUPERVISOR DE TRANSFORMACIÓN DIGITAL · PGM</text>
  </g>

  <g fill="none" stroke="#7ee0b8" stroke-width="1.5" stroke-opacity=".7">
    <path class="f" d="M1030 150L935 84"/>
    <path class="f" d="M1030 150L1128 76"/>
    <path class="f" d="M1030 150L1146 178"/>
    <path class="f" d="M1030 150L1075 258"/>
    <path class="f" d="M1030 150L948 232"/>
  </g>
  <circle class="ring" cx="1030" cy="150" r="30" fill="none" stroke="#7ee0b8" stroke-width="1.5"/>
  <circle cx="1030" cy="150" r="30" fill="#0f1a22" stroke="#7ee0b8" stroke-width="2"/>
  <text x="1030" y="155" class="mono" font-size="15" font-weight="700" text-anchor="middle" fill="#7ee0b8">ERP</text>
  <g class="mono" font-size="13" text-anchor="middle" fill="#c9d4e2">
    <circle cx="935" cy="84" r="22" fill="#101826" stroke="#2c3d57"/>
    <text x="935" y="88.5">IA</text>
    <circle cx="1128" cy="76" r="22" fill="#101826" stroke="#2c3d57"/>
    <text x="1128" y="80.5">n8n</text>
    <circle cx="1146" cy="178" r="22" fill="#101826" stroke="#2c3d57"/>
    <text x="1146" y="182.5">API</text>
    <circle cx="1075" cy="258" r="22" fill="#101826" stroke="#2c3d57"/>
    <text x="1075" y="262.5">SQL</text>
    <circle cx="948" cy="232" r="22" fill="#101826" stroke="#2c3d57"/>
    <text x="948" y="236.5">CI</text>
  </g>
</svg>
